<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear gasto</title>
</head>
<body>
    <h1>Crar una nueva cuenta bancaria</h1>
    <form method="POST" action="{{url_for('agregar_gasto')}}">
        <label for="gasto">Agrega tu gasto con categoria y monto: </label>
        <br><br/>
        <label for="monto">Categoria: </label>
        <input type="text" name="categoria" required/>
        <br><br/>
        <label for="monto">Monto: </label>
        <input type="number" step= "0.01" name="monto" id="monto" required/>       
        <br><br/>
        <button type="submit">Agregar gasto</button>
    </form>
    <a href="{{url_for('index')}}">Volver al menu principal</a>
</body>
</html>
